<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101418">
<link rel="manifest" href="manifest.webmanifest">

<title>Gujlish Fix</title>
<style>
  :root { color-scheme: dark light; --bg:#101418; --fg:#e8ecf1; --mut:#8b949e; --card:#161b22; --line:#30363d; --acc:#1f6feb; --mark:#3d2a00; --markfg:#ffd166; --ok:#2ea043; --bad:#f85149; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f8fa; --fg:#1f2328; --mut:#656d76; --card:#fff; --line:#d0d7de; --mark:#fff3c4; --markfg:#7a5200; } }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font:17px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom)); max-width:720px; margin:0 auto; }
  h1 { font-size:18px; margin:4px 0 10px; display:flex; justify-content:space-between; align-items:baseline; }
  h1 small { color:var(--mut); font-weight:400; font-size:13px; }
  textarea { width:100%; min-height:150px; font:inherit; font-size:19px; line-height:1.4; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--fg); resize:vertical; }
  textarea:focus { outline:2px solid var(--acc); border-color:transparent; }
  #strip { display:flex; gap:8px; overflow-x:auto; min-height:44px; padding:6px 0; -webkit-overflow-scrolling:touch; }
  #strip:empty::before { content:"suggestions appear here as you type"; color:var(--mut); font-size:14px; align-self:center; }
  .chip { flex:0 0 auto; padding:8px 14px; border-radius:18px; background:var(--card); border:1px solid var(--line); font-size:16px; }
  .chip:active { background:var(--acc); color:#fff; }
  .row { display:flex; gap:10px; margin:8px 0; }
  button { flex:1; font:inherit; font-size:17px; font-weight:600; padding:13px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  button.primary { background:var(--acc); color:#fff; border-color:transparent; }
  button:disabled { opacity:.5; }
  #diff { margin:10px 0; padding:10px 12px; border-radius:12px; background:var(--card); border:1px solid var(--line); font-size:17px; line-height:1.6; min-height:44px; }
  #diff:empty { display:none; }
  mark { background:var(--mark); color:var(--markfg); border-radius:4px; padding:0 3px; }
  del { color:var(--mut); text-decoration:line-through; margin-right:2px; font-size:14px; }
  #foot { color:var(--mut); font-size:12px; line-height:1.6; margin-top:14px; border-top:1px solid var(--line); padding-top:8px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
</style>
</head>

const OK = new Set(GATEV.ok), KEEP = new Set(GATEV.keep);
const SEGMENT_CAP = 0.4, MAX_CHARS = 64;
const plausible = (s, o) => osa(looseKey(s), looseKey(o)) <= 1 || osa(s, o) <= 2;
function wordOk(s, o) {
  if (s === o) return true;
  if (!OK.has(o) || !plausible(s, o)) return false;
  if (KEEP.has(s) && looseKey(s) !== looseKey(o)) return false;
  return true;
}
function opcodes(a, b) { // difflib-style blocks via LCS on words
  const n = a.length, m = b.length, L = Array.from({length: n + 1}, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i+1][j+1] + 1 : Math.max(L[i+1][j], L[i][j+1]);
  const ops = []; let i = 0, j = 0, si = 0, sj = 0;
  const flush = () => { if (si < i || sj < j) ops.push(["diff", si, i, sj, j]); };
  while (i < n || j < m) {
    if (i < n && j < m && a[i] === b[j]) { flush(); ops.push(["equal", i, i + 1, j, j + 1]); i++; j++; si = i; sj = j; }
    else if (j < m && (i >= n || L[i][j+1] >= L[i+1][j])) j++;
    else i++;

}
function gateApply(srcRaw, out) {
  const src = srcRaw.toLowerCase();
  if (!out) return src;
  const sw = src.split(" "), ow = out.split(" ").filter(Boolean), rw = srcRaw.split(" ");
  if (!sw.length || !ow.length) return src;
  const res = [];
  for (const [tag, i1, i2, j1, j2] of opcodes(sw, ow)) {
    const sb = sw.slice(i1, i2), ob = ow.slice(j1, j2);
    if (tag === "equal") { res.push(...sb); continue; }
    if (sb.length === ob.length) {
      sb.forEach((s, k) => { const raw = rw[i1 + k] || ""; const named = /^[A-Z]/.test(raw) && (i1 + k) > 0;
        res.push(!named && wordOk(s, ob[k]) ? ob[k] : s); });
      continue;
    }
    const namedIn = rw.slice(Math.max(i1, 1), i2).some(w => /^[A-Z]/.test(w));
    if (ob.length && ob.every(o => OK.has(o)) && !namedIn && !sb.some(s => KEEP.has(s))

async function fixRun(run) {
  const pieces = [];

    pieces.push(gateApply(ch, raw));
  }
  let out = pieces.join(" ");
  if (/^[A-Z]/.test(run)) out = out[0].toUpperCase() + out.slice(1);

async function fixText(text) {
  const re = /[A-Za-z]+(?: +[A-Za-z]+)*/g;
  let res = "", last = 0, m;
  while ((m = re.exec(text))) { res += text.slice(last, m.index) + await fixRun(m[0]); last = m.index + m[0].length; }
  return res + text.slice(last);
}

const ta = document.getElementById("t"), strip = document.getElementById("strip"), diffEl = document.getElementById("diff");
const btnFix = document.getElementById("fix"), btnUndo = document.getElementById("undo"), btnCopy = document.getElementById("copy");
let before = null;
function wordDiff(a, b) {
  const A = a.split(/\s+/).filter(Boolean), B = b.split(/\s+/).filter(Boolean);
  const n = A.length, m = B.length, L = Array.from({length: n + 1}, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i+1][j+1] + 1 : Math.max(L[i+1][j], L[i][j+1]);
  const out = []; let i = 0, j = 0;
  const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  while (i < n || j < m) {
    if (i < n && j < m && A[i] === B[j]) { out.push(esc(A[i])); i++; j++; }
    else if (j < m && (i >= n || L[i][j+1] >= L[i+1][j])) {
      if (i < n && L[i+1][j+1] >= L[i][j+1] && L[i+1][j+1] >= L[i+1][j]) { out.push(`<del>${esc(A[i])}</del><mark>${esc(B[j])}</mark>`); i++; j++; }
      else { out.push(`<mark>${esc(B[j])}</mark>`); j++; }
    } else { out.push(`<del>${esc(A[i])}</del>`); i++; }
  }
  return out.join(" ");
}
function currentWord() {
  const pos = ta.selectionStart, s = ta.value.slice(0, pos);
  const m = /([A-Za-z]*)$/.exec(s); const typed = m ? m[1] : "";
  const pre = s.slice(0, s.length - typed.length).trimEnd();
  const pm = /([A-Za-z]+)$/.exec(pre);
  return {typed, prev: pm ? pm[1] : null, start: pos - typed.length, end: pos};
}
function refreshStrip() {
  const {typed, prev} = currentWord();
  const words = typed ? suggest(typed, prev) : nextWord(prev);
  strip.innerHTML = "";
  for (const w of words) {
    const c = document.createElement("span"); c.className = "chip"; c.textContent = w;
    c.onpointerdown = e => { e.preventDefault(); const {start, end} = currentWord();
      ta.setRangeText(w + " ", start, end, "end"); ta.focus(); refreshStrip(); };
    strip.appendChild(c);
  }
}
ta.addEventListener("input", refreshStrip);

btnFix.onclick = async () => {
  const text = ta.value; if (!text.trim()) return;
  btnFix.disabled = true; btnFix.textContent = "Fixing…";
  const t0 = performance.now();
  try {
    const out = await fixText(text);
    const ms = Math.round(performance.now() - t0);
    before = text; ta.value = out; btnUndo.disabled = false;
    diffEl.innerHTML = out === text ? "<span style='color:var(--mut)'>nothing to change</span>" : wordDiff(text, out);
    document.getElementById("f-time").textContent = `${ms} ms, ${MODEL.status === "ready" ? "model" : "lexicon fallback"}, ${text.length} chars`;
  } catch (e) {
    diffEl.innerHTML = `<span class="bad">fix failed: ${String(e).slice(0, 120)}</span>`;
  }
  btnFix.disabled = false; btnFix.textContent = "Fix"; refreshStrip();
};
btnUndo.onclick = () => { if (before !== null) { ta.value = before; before = null; btnUndo.disabled = true; diffEl.innerHTML = ""; } };
btnCopy.onclick = async () => {
  try { await navigator.clipboard.writeText(ta.value); }
  catch (e) { ta.select(); document.execCommand("copy"); }
  btnCopy.textContent = "Copied"; setTimeout(() => btnCopy.textContent = "Copy", 900);
