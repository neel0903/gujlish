# Xcode project definition. The .xcodeproj is generated from this file:
#   python3 build_ios_assets.py && xcodegen --spec ios/project.yml
# so the project itself never has to be merged by hand.
name: Gujlish
options:
  bundleIdPrefix: com.neel0903
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 4S25F3LG2C   # Neel's free Personal Team
    TARGETED_DEVICE_FAMILY: "1"
packages:
  GujlishCore:
    path: GujlishCore
targets:
  Gujlish:
    type: application
    platform: iOS
    sources:
      - path: Gujlish
      - path: Assets/gujlish.db
        buildPhase: resources
    dependencies:
      - package: GujlishCore
      - target: GujlishKeyboard
    info:
      path: Gujlish/Info.plist
      properties:
        CFBundleDisplayName: Gujlish
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neel0903.gujlish
  GujlishKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: GujlishKeyboard
      - path: Assets/gujlish.db
        buildPhase: resources
    dependencies:
      - package: GujlishCore
    info:
      path: GujlishKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Gujlish
        CADisableMinimumFrameDurationOnPhone: true   # 120 Hz on ProMotion phones
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: gu-Latn
            RequestsOpenAccess: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neel0903.gujlish.keyboard
